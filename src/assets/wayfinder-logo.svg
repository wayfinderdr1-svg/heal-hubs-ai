<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="180" fill="#f5f5f5" />
  
  <!-- Compass Rose Outline -->
  <circle cx="200" cy="200" r="140" fill="#ffffff" stroke="#3a86ff" stroke-width="4" />
  
  <!-- Inner Circle Gradient -->
  <circle cx="200" cy="200" r="110" fill="url(#grad1)" />
  
  <!-- Animated Compass Points -->
  <g id="compass">
    <animateTransform attributeName="transform"
                      attributeType="XML"
                      type="rotate"
                      from="0 200 200"
                      to="360 200 200"
                      dur="20s"
                      repeatCount="indefinite"
                      additive="sum" />
    
    <path d="M200,90 L210,200 L200,190 L190,200 L200,90 Z" fill="#3a86ff">
      <animate attributeName="opacity" values="1;0.7;1" dur="3s" repeatCount="indefinite" />
    </path>
    <path d="M200,310 L210,200 L200,210 L190,200 L200,310 Z" fill="#8ecae6">
      <animate attributeName="opacity" values="1;0.8;1" dur="4s" repeatCount="indefinite" />
    </path>
    <path d="M90,200 L200,190 L190,200 L200,210 L90,200 Z" fill="#8ecae6">
      <animate attributeName="opacity" values="1;0.7;1" dur="3.5s" repeatCount="indefinite" />
    </path>
    <path d="M310,200 L200,190 L210,200 L200,210 L310,200 Z" fill="#3a86ff">
      <animate attributeName="opacity" values="1;0.8;1" dur="4.5s" repeatCount="indefinite" />
    </path>
  </g>
  
  <!-- Central Point -->
  <circle cx="200" cy="200" r="15" fill="#ffffff" stroke="#3a86ff" stroke-width="3" />
  
  <!-- Path Element -->
  <path d="M95,270 C130,240 180,290 200,270 C220,250 270,300 305,270" 
        stroke="#72efdd" stroke-width="8" fill="none" stroke-linecap="round" />
  
  <!-- Centered Text Elements -->
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="36" font-weight="bold" 
        text-anchor="middle" fill="#1e3a8a">WayFinder</text>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a86ff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#8ecae6;stop-opacity:0.1" />
    </linearGradient>
  </defs>
</svg>